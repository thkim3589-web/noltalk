<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7c4dff">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>놀톡</title>
<style>
:root{--p:#7c4dff;--acc:#ffcc00;--bg:#f4f1ff;--txt:#222;--sub:#888;--line:#e6e0ff;--card:#fff;--soft:#efe9ff}
:root[data-theme="dark"]{--bg:#14121b;--card:#211e2b;--txt:#ececf1;--sub:#9a95ab;--line:#332e42;--soft:#2c2640}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:var(--bg);color:var(--txt);overflow:hidden}
button{font:inherit;border:0;cursor:pointer;color:inherit}
input{font:inherit}
.screen{display:none;height:100%;flex-direction:column}
.screen.active{display:flex}
/* 로그인 */
#login{align-items:center;justify-content:center;padding:24px;background:linear-gradient(160deg,#7c4dff,#ff6fb5)}
.logo{font-size:56px}
.brand{color:#fff;font-size:36px;font-weight:800;margin:8px 0 4px}
.tag{color:#fff;opacity:.9;margin-bottom:28px}
.login-box{background:var(--card);border-radius:20px;padding:20px;width:100%;max-width:340px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
.field{color:var(--txt);width:100%;padding:14px;border:2px solid var(--line);border-radius:12px;font-size:16px;outline:none;background:var(--card)}
.field:focus{border-color:var(--p)}
.btn{background:var(--p);color:#fff;padding:14px;border-radius:12px;font-weight:700;font-size:16px;width:100%}
.btn.ghost{background:var(--soft);color:var(--p)}
.btn:disabled{opacity:.45}
/* 헤더 */
.hdr{display:flex;align-items:center;gap:8px;padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top));background:var(--p);color:#fff}
.hdr h1{font-size:19px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{background:rgba(255,255,255,.2);color:#fff;border-radius:10px;padding:8px 10px;font-size:14px;flex-shrink:0}
.tabs{display:flex;background:var(--card);border-bottom:1px solid var(--line)}
.tabs button{flex:1;padding:12px;background:none;color:var(--sub);font-weight:700;border-bottom:3px solid transparent}
.tabs button.on{color:var(--p);border-color:var(--p)}
.list{flex:1;overflow-y:auto;padding:10px 12px 110px}
.room-item{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:12px;margin-bottom:8px;cursor:pointer}
.avatar{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--p),#ff6fb5);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;flex-shrink:0}
.ri-body{flex:1;min-width:0}
.ri-top{display:flex;justify-content:space-between;gap:8px}
.ri-top b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ri-top span{color:var(--sub);font-size:12px;flex-shrink:0}
.ri-last{color:var(--sub);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.cnt{font-size:12px;color:var(--sub);flex-shrink:0}
.empty{text-align:center;color:var(--sub);padding:40px 0}
.fab-row{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;padding:14px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(rgba(244,241,255,0),var(--bg) 35%)}
/* 채팅방 */
#msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px}
.sys{align-self:center;background:rgba(124,77,255,.12);color:var(--p);font-size:12px;padding:5px 12px;border-radius:20px;margin:4px 0;text-align:center;max-width:90%}
.msg{max-width:78%;align-self:flex-start;display:flex;flex-direction:column}
.msg.mine{align-self:flex-end;align-items:flex-end}
.who{font-size:12px;color:var(--sub);margin:0 0 2px 4px}
.bubble{background:var(--card);padding:9px 13px;border-radius:16px 16px 16px 4px;font-size:15px;line-height:1.4;word-break:break-word;white-space:pre-wrap}
.mine .bubble{background:var(--p);color:#fff;border-radius:16px 16px 4px 16px}
.time{font-size:10px;color:var(--sub);margin:2px 4px 0}
.game-card{background:var(--card);border:2px solid var(--acc);border-radius:16px;padding:12px;min-width:210px}
.gc-title{font-weight:800;font-size:16px}
.gc-sub{color:var(--sub);font-size:13px;margin:4px 0 10px}
.game-card button{background:var(--acc);color:#222;font-weight:800;padding:9px;border-radius:10px;width:100%}
.inputbar{display:flex;gap:8px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);align-items:center}
.inputbar input{color:var(--txt);flex:1;min-width:0;padding:11px 14px;border-radius:22px;border:1px solid var(--line);background:var(--bg);outline:none;font-size:16px}
.round{width:42px;height:42px;border-radius:50%;font-size:20px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.round.game{background:var(--acc)}
.round.send{background:var(--p);color:#fff}
/* 시트 */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:50}
.overlay.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:94vh;overflow-y:auto;animation:up .2s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h2{font-size:18px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.x{background:var(--bg);border-radius:50%;width:32px;height:32px;font-size:15px;flex-shrink:0}
.game-pick{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;background:var(--bg);margin-bottom:8px;width:100%;text-align:left}
.game-pick .gi{font-size:30px}
.game-pick small{display:block;color:var(--sub)}
.row{display:flex;gap:8px;margin-top:10px}
.chk{display:flex;align-items:center;gap:8px;margin:12px 0;color:var(--txt)}
/* 게임 화면 */
.players{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{background:var(--bg);padding:6px 10px;border-radius:20px;font-size:13px}
.chip.turn{background:var(--acc);font-weight:800}
.status{text-align:center;font-weight:700;margin:10px 0;font-size:16px}
.rps-btns{display:flex;gap:10px;justify-content:center;margin:16px 0}
.rps-btns button{font-size:44px;background:var(--bg);border-radius:18px;width:84px;height:84px}
.rps-btns button:active{transform:scale(.92)}
.big{font-size:56px;text-align:center;letter-spacing:12px;margin:10px 0}
.chain{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0;max-height:160px;overflow-y:auto}
.chain span{background:var(--bg);padding:6px 10px;border-radius:10px;font-weight:700}
.chain span:last-child{background:var(--p);color:#fff}
.next{text-align:center;font-size:15px;margin:6px 0}
.next b{font-size:24px;color:var(--p)}
.timer{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:8px 0}
.timer i{display:block;height:100%;width:100%;background:var(--p);transition:width .25s linear}
.board{display:grid;grid-template-columns:repeat(15,1fr);background:#e8c37a;border-radius:8px;padding:4px;width:100%;max-width:440px;margin:8px auto;touch-action:manipulation}
.cell{position:relative;background:none;aspect-ratio:1;padding:0}
.cell::before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:1px solid #8a6a2f}
.cell::after{content:"";position:absolute;top:50%;left:0;right:0;border-top:1px solid #8a6a2f}
.stone{position:absolute;inset:7%;border-radius:50%;z-index:1}
.stone.B{background:radial-gradient(circle at 35% 30%,#666,#000)}
.stone.W{background:radial-gradient(circle at 35% 30%,#fff,#ccc);box-shadow:0 0 0 1px #aaa}
.stone.last{box-shadow:0 0 0 2px #ff3d71}
.bingo{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;max-width:340px;margin:10px auto}
.bc{aspect-ratio:1;border-radius:12px;background:var(--bg);font-size:20px;font-weight:800;color:var(--txt)}
.bc.hit{background:var(--p);color:#fff}
.bc.can:active{transform:scale(.92)}
.bc.lastcall{box-shadow:0 0 0 3px var(--acc)}
.lines{display:flex;justify-content:center;gap:6px;margin:4px 0}
.lines span{width:28px;height:8px;border-radius:4px;background:var(--line)}
.lines span.on{background:var(--acc)}
.searchbar{padding:10px 12px 0;background:var(--bg)}
.searchbar input{color:var(--txt);width:100%;padding:11px 14px;border-radius:22px;border:1px solid var(--line);background:var(--card);outline:none;font-size:15px}
.card{border-radius:16px;padding:16px;text-align:center;margin:10px 0;background:linear-gradient(135deg,#efe9ff,#ffe3f1)}
.card.dark{background:linear-gradient(135deg,#2b2140,#4a2340);color:#fff}
.card .big2{font-size:26px;font-weight:800;margin-top:6px}
.card small{display:block;opacity:.75;margin-top:6px}
.pick-list{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.pick-list button{background:var(--bg);padding:12px 8px;border-radius:12px;font-weight:700}
.pick-list button.sel{background:var(--p);color:#fff}
.pick-list button:disabled{opacity:.4}
.log{background:var(--bg);border-radius:12px;padding:10px 12px;font-size:13px;color:var(--sub);margin:8px 0;max-height:120px;overflow-y:auto}
.log div{padding:2px 0}
.hint{font-size:13px;color:var(--sub);text-align:center;margin:6px 0}
.host-row{margin-top:10px}
.ladder-wrap{overflow-x:auto;margin:8px 0}
.ladder-res{display:flex;flex-direction:column;gap:4px;margin:8px 0}
.ladder-res div{background:var(--bg);border-radius:10px;padding:8px 12px;font-size:14px;display:flex;justify-content:space-between}
.ladder-res div.me{background:var(--acc);font-weight:800}
.or{text-align:center;color:var(--sub);font-size:13px;margin:12px 0 8px}
.gbtn{background:var(--card);color:var(--txt);border:2px solid var(--line)}
.banner{display:flex;align-items:center;gap:8px;background:#fff6d6;color:#7a5b00;font-size:13px;padding:9px 12px}
.banner span{flex:1}
.banner button{background:#ffcc00;color:#222;font-weight:800;border-radius:10px;padding:7px 10px;font-size:13px;flex-shrink:0}
.sort-chips{display:flex;gap:6px;margin-bottom:8px}
.sort-chips button{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--sub)}
.sort-chips button.on{background:var(--p);border-color:var(--p);color:#fff}
.more{display:block;margin:8px auto 0;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:9px 18px;font-weight:700;color:var(--p)}
.who{cursor:pointer}
.bubble.muted{background:var(--line)!important;color:var(--sub)!important;font-size:13px;font-style:italic}
.menu-list button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px;border-radius:12px;background:var(--bg);margin-bottom:8px;font-size:15px;font-weight:600}
.menu-list button.danger{color:#e53950;background:#fff0f2}
.member{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.member .avatar{width:36px;height:36px;font-size:15px;border-radius:12px}
.member b{flex:1}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:rgba(30,30,30,.92);color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:99;display:none;max-width:90%;text-align:center}
[data-theme="dark"] .card{background:linear-gradient(135deg,#2c2640,#3a2436)}
[data-theme="dark"] .banner{background:#3a3214;color:#ffe08a}
[data-theme="dark"] .menu-list button.danger{background:#3a1f26}
[data-theme="dark"] .fab-row{background:linear-gradient(rgba(20,18,27,0),var(--bg) 35%)}
[data-theme="dark"] .sys{background:rgba(124,77,255,.22);color:#c9b8ff}
[data-theme="dark"] .login-box{background:var(--card)}
/* 편의 기능 */
.badge{background:#ff3d71;color:#fff;font-size:11px;font-weight:800;border-radius:10px;padding:2px 7px;min-width:20px;text-align:center}
.badge.mute{background:var(--sub)}
.ri-side{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.online-pill{font-size:12px;background:rgba(255,255,255,.18);padding:4px 8px;border-radius:12px;white-space:nowrap}
.online-pill:empty{display:none}
.room-title{flex:1;min-width:0;display:flex;flex-direction:column}
.room-title small{font-size:11px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.date-sep{align-self:stretch;display:flex;align-items:center;gap:8px;color:var(--sub);font-size:12px;margin:8px 0}
.date-sep::before,.date-sep::after{content:"";flex:1;border-top:1px solid var(--line)}
.mrow{display:flex;gap:8px;align-items:flex-start;max-width:86%;align-self:flex-start;border-radius:12px}
.mrow.mine{align-self:flex-end;flex-direction:row-reverse}
.mrow .msg{max-width:100%}
.av,.av-sp{width:34px;height:34px;flex-shrink:0}
.av{border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:17px;cursor:pointer}
.bubble,.game-card{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.quote{font-size:12px;opacity:.8;border-left:3px solid currentColor;padding:2px 0 2px 8px;margin-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;max-width:240px}
.reacts{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.react{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:2px 7px;font-size:12px;cursor:pointer}
.react.on{border-color:var(--p);background:var(--soft)}
.react-pick{display:flex;justify-content:space-between;margin-bottom:12px}
.react-pick button{font-size:26px;background:var(--bg);border-radius:14px;width:46px;height:46px}
.react-pick button.on{background:var(--soft);box-shadow:0 0 0 2px var(--p)}
.older{align-self:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 14px;font-size:13px;color:var(--p);font-weight:700;margin-bottom:4px}
.typing{font-size:12px;color:var(--sub);padding:0 14px;height:0;overflow:hidden}
.typing:not(:empty){height:20px;line-height:20px}
.reply-bar{display:flex;align-items:center;gap:8px;background:var(--soft);padding:8px 12px;font-size:13px;border-top:1px solid var(--line)}
.reply-bar span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reply-bar button{background:none;font-size:16px;color:var(--sub)}
.notice-bar{display:flex;align-items:flex-start;gap:8px;background:var(--card);border-bottom:1px solid var(--line);padding:10px 12px;font-size:14px;cursor:pointer}
.notice-bar span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.notice-bar.open span{white-space:pre-wrap}
.notice-bar button{background:none;color:var(--sub)}
.flash{animation:flash 1.4s}
@keyframes flash{0%,60%{background:rgba(255,204,0,.35)}100%{background:transparent}}
.pf-top{display:flex;align-items:center;gap:14px;margin-bottom:4px}
.pf-av{width:64px;height:64px;border-radius:20px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:32px;font-weight:800;flex-shrink:0}
.pf-top b{display:block;font-size:18px;margin-bottom:6px}
.pf-label{font-size:13px;color:var(--sub);margin:14px 0 6px;font-weight:700}
.mini{background:var(--soft);color:var(--p);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:700}
.emoji-grid{display:grid;grid-template-columns:repeat(9,1fr);gap:6px}
.emoji-grid button{font-size:20px;background:var(--bg);border-radius:10px;aspect-ratio:1;padding:0}
.emoji-grid button.on,.seg button.on{box-shadow:0 0 0 2px var(--p);background:var(--soft)}
.color-row{display:flex;flex-wrap:wrap;gap:10px}
.color-row button{width:30px;height:30px;border-radius:50%}
.color-row button.on{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--txt)}
.seg{display:flex;gap:6px}
.seg button{flex:1;background:var(--bg);border-radius:10px;padding:10px 4px;font-size:13px;font-weight:700}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.stat-grid div{background:var(--bg);border-radius:10px;padding:8px 10px;font-size:13px}
.stat-grid b{display:block;margin-top:2px}
.rank-row{display:flex;align-items:center;gap:10px;padding:8px 6px;border-bottom:1px solid var(--line)}
.rank-row.me{background:var(--soft);border-radius:10px}
.rank-row .rk{width:28px;text-align:center;font-weight:800}
.rank-row b{flex:1}
.rank-row span:last-child{font-size:13px;color:var(--sub)}
.on-dot{color:#2ecc71;font-size:10px}
.member .av{width:36px;height:36px}
</style>
</head>
<body>

<div id="login" class="screen">
  <div class="logo">💬🎮</div>
  <div class="brand">놀톡</div>
  <div class="tag">수다 떨다가, 바로 한판!</div>
  <div class="login-box">
    <input id="nick" class="field" maxlength="12" placeholder="닉네임 (한글·영문·숫자 2~12자)">
    <button id="startBtn" class="btn" style="margin-top:10px">시작하기</button>
    <div class="or">또는</div>
    <button id="googleBtn" class="btn gbtn">🔐 구글 계정으로 시작 · 계정 복구</button>
  </div>
</div>

<div id="home" class="screen">
  <div class="hdr"><h1>놀톡</h1><span id="onlineCnt" class="online-pill"></span><span id="meName" style="font-size:14px;opacity:.9"></span><button class="ib" id="profileBtn">👤</button></div>
  <div id="acctBanner" class="banner" style="display:none"><span>⚠️ 지금은 앱을 지우면 계정이 사라져요</span><button id="linkBtn">구글 계정 연결</button></div>
  <div id="updBanner" class="banner" style="display:none"><span>🆕 새 버전 앱이 나왔어요</span><button id="updBtn">업데이트</button></div>
  <div class="tabs"><button class="on" data-tab="myRooms" id="tabMy">내 채팅방</button><button data-tab="publicRooms">🔥 공개방</button></div>
  <div class="searchbar"><input id="roomSearch" placeholder="🔍 방 이름 또는 초대코드로 찾기" autocomplete="off" enterkeyhint="search"></div>
  <div id="myRooms" class="list"></div>
  <div id="publicWrap" class="list" style="display:none">
    <div class="sort-chips"><button class="on" data-sort="recent">🕐 최근 대화순</button><button data-sort="popular">👥 인원 많은순</button></div>
    <div id="publicRooms"></div>
  </div>
  <div class="fab-row"><button class="btn ghost" id="joinCodeBtn">🔑 코드로 입장</button><button class="btn" id="newRoomBtn">＋ 방 만들기</button></div>
</div>

<div id="room" class="screen">
  <div class="hdr"><button class="ib" id="backBtn">←</button><div class="room-title"><h1 id="roomName"></h1><small id="roomOnline"></small></div><button class="ib" id="shareBtn">초대</button><button class="ib" id="menuBtn">☰</button></div>
  <div id="noticeBar" class="notice-bar" style="display:none"></div>
  <div id="msgs"></div>
  <div id="typingBar" class="typing"></div>
  <div id="replyBar" class="reply-bar" style="display:none"></div>
  <div class="inputbar"><button class="round game" id="gameBtn">🎮</button><input id="msgInput" maxlength="500" placeholder="메시지 입력" enterkeyhint="send" autocomplete="off"><button class="round send" id="sendBtn">➤</button></div>
</div>

<div class="overlay" id="newRoomDlg"><div class="sheet"><h2>새 채팅방 <button class="x" data-close>✕</button></h2>
  <input id="roomNameInput" class="field" maxlength="20" placeholder="방 이름">
  <label class="chk"><input type="checkbox" id="publicChk" checked> 공개방 (누구나 목록에서 보고 입장)</label>
  <input id="roomPwInput" class="field" style="margin-bottom:12px" maxlength="20" placeholder="🔒 비밀번호 (선택 · 비워두면 없음)" autocomplete="off">
  <button class="btn" id="createRoomBtn">만들기</button></div></div>

<div class="overlay" id="joinDlg"><div class="sheet"><h2>코드로 입장 <button class="x" data-close>✕</button></h2>

async function hashPw(roomId, pw){

  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join('');
}

async function setMembership(roomId, uid, join, extra = {}){
  const ref = doc(db,'rooms',roomId);
  return runTransaction(db, async t => {
    const s = await t.get(ref); if (!s.exists()) throw new Error('방을 찾을 수 없어요');
    const r = s.data(); let members = r.members || [];
    if (join) {
      if ((r.banned || []).includes(uid)) throw new Error('방장이 내보낸 방이라 다시 들어갈 수 없어요');
      if (!members.includes(uid)) members = [...members, uid];
    } else members = members.filter(x => x !== uid);
    const u = { members, ...(typeof extra === 'function' ? extra(r, members) : extra) };
    if (r.isPublic) u.pubMembers = members.length;
    t.update(ref, u);
    return { ...r, members };
  });
}

// 도배 방지: 5초에 5개까지, 같은 말 3번 연속 금지
const sentTimes = []; let lastTexts = [];
function spamCheck(t){
  const now = Date.now();
  while (sentTimes.length && now - sentTimes[0] > 5000) sentTimes.shift();
  if (sentTimes.length >= 5) return '너무 빨라요! 잠깐 쉬었다 보내주세요 🐢';
  if (lastTexts.length >= 2 && lastTexts.every(x => x === t)) return '같은 메시지를 계속 보낼 수 없어요';
  sentTimes.push(now); lastTexts = [...lastTexts, t].slice(-2);
  return null;
}
async function sendMsg(){
  const inp = $('#msgInput');
  const t = clean(inp.value.trim());
  if (!t || !room) return;
  const err = spamCheck(t); if (err) return toast(err);
  inp.value = '';
  const rp = replyTo; setReply(null); clearTyping();
  try { await post({ type:'text', text:t.slice(0,500), ...(rp ? { reply: rp } : {}) }, `${me.name}: ${t}`); }
  catch(e) { toast('전송 실패'); inp.value = t; }
}

// 두음법칙: 녀→여, 리→이, 라→나 등
function dueum(ch){
  const c = ch.charCodeAt(0) - 0xAC00;
  if (c < 0 || c > 11171) return null;
  const cho = Math.floor(c / 588), jung = Math.floor((c % 588) / 28), jong = c % 28;
  const yv = [2,6,7,12,17,20]; // ㅑㅕㅖㅛㅠㅣ
  let nc = null;
  if (cho === 5) nc = yv.includes(jung) ? 11 : 2;           // ㄹ → ㅇ / ㄴ
  else if (cho === 2 && [6,7,12,17,20].includes(jung)) nc = 11; // ㄴ → ㅇ
  return nc === null ? null : String.fromCharCode(0xAC00 + (nc * 21 + jung) * 28 + jong);
}
function newBingoBoard(){
  const a = Array.from({ length:25 }, (_, i) => i + 1);
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
const BINGO_GOAL = 3;
function bingoLines(board, called){
  const hit = new Set(called), L = [];
  for (let i = 0; i < 5; i++) { L.push([0,1,2,3,4].map(k => i*5 + k)); L.push([0,1,2,3,4].map(k => k*5 + i)); }
  L.push([0,6,12,18,24], [4,8,12,16,20]);
  return L.filter(l => l.every(i => hit.has(board[i]))).length;
}

/* 사다리 */
const LADDER_ROWS = 9;
function makeRungs(n){
  const rungs = [];
  for (let r = 0; r < LADDER_ROWS; r++) {
    let prev = -2;
    for (let c = 0; c < n - 1; c++) if (c !== prev + 1 && Math.random() < 0.45) { rungs.push({ r, c }); prev = c; }
  }
  for (let c = 0; c < n - 1; c++) if (!rungs.some(x => x.c === c)) { // 모든 칸 사이에 가로줄 최소 1개
    const r = Math.floor(Math.random() * LADDER_ROWS);
    if (!rungs.some(x => x.r === r && Math.abs(x.c - c) <= 1)) rungs.push({ r, c });
  }
  return rungs;
}
function ladderEnd(n, rungs, start){
  const has = new Set(rungs.map(x => x.r * 100 + x.c));
  let c = start;
  for (let r = 0; r < LADDER_ROWS; r++) { if (has.has(r*100 + c)) c++; else if (has.has(r*100 + c - 1)) c--; }
  return c;
}
function ladderRound(g, outcomes){
  const n = g.players.length, rungs = makeRungs(n);
  const lines = g.players.map((p,i) => `${p.name} → ${outcomes[ladderEnd(n, rungs, i)]}`);
  return { u: { status:'done', outcomes, rungs }, msg: `🪜 사다리 결과\n${lines.join('\n')}` };
}

/* 마피아 */
const ROLE = { mafia:'🔪 마피아', doctor:'💉 의사', police:'👮 경찰', citizen:'🙂 시민' };
function mafiaRound(g){
  const n = g.players.length, deck = [];
  for (let i = 0; i < (n >= 7 ? 2 : 1); i++) deck.push('mafia');
  deck.push('police'); if (n >= 5) deck.push('doctor');
  while (deck.length < n) deck.push('citizen');
  const roles = {}; shuffle(deck).forEach((r,i) => roles[g.players[i].uid] = r);
  return { status:'playing', phase:'night', day:1, roles, alive: g.players.map(p => p.uid), night:{}, votes:{}, checks:{}, winner:null,
    log:['🌙 1일차 밤이 되었어요. 마피아·경찰·의사는 행동을 고르세요.'] };
}
function mafiaWin(g, alive){
  const m = alive.filter(u => g.roles[u] === 'mafia').length;
  if (m === 0) return 'citizen';
  if (m >= alive.length - m) return 'mafia';
  return null;
}
const nightActors = (g) => g.alive.filter(u => g.roles[u] !== 'citizen');
function mafiaResolveNight(g, night){
  let alive = [...g.alive], log = [...g.log], msg;
  const kill = night.kill;
  if (kill && kill === night.save) { log.push(`☀️ ${g.day}일차 아침: 의사가 누군가를 살렸어요! 아무도 죽지 않았어요.`); msg = '🔪 마피아: 의사가 사람을 살렸어요! 아무도 죽지 않은 아침 ☀️'; }
  else if (kill) { alive = alive.filter(u => u !== kill); log.push(`☀️ ${g.day}일차 아침: ${nameOf(g,kill)}님이 밤사이 당했어요 💀`); msg = `🔪 마피아: ${nameOf(g,kill)}님이 밤사이 당했어요 💀 토론을 시작하세요!`; }
  else { log.push(`☀️ ${g.day}일차 아침: 조용한 밤이었어요.`); msg = '🔪 마피아: 조용한 밤이 지나갔어요 ☀️'; }
  const w = mafiaWin(g, alive);
  if (w) return { u: { night, alive, log, phase:'done', status:'done', winner:w }, msg: msg + `\n${w === 'mafia' ? '🔪 마피아 승리!' : '🙂 시민 승리!'}` };
  return { u: { night, alive, log, phase:'day', votes:{} }, msg };
}
function mafiaResolveDay(g, votes){
  const cnt = {};
  Object.values(votes).forEach(v => { if (v !== 'skip') cnt[v] = (cnt[v] || 0) + 1; });
  const max = Math.max(0, ...Object.values(cnt)), top = Object.keys(cnt).filter(k => cnt[k] === max);
  let alive = [...g.alive], log = [...g.log], msg;
  if (max > 0 && top.length === 1) {
    const out = top[0]; alive = alive.filter(u => u !== out);

  } else { log.push('⚖️ 투표가 갈려 아무도 처형되지 않았어요.'); msg = '🔪 마피아: 투표가 갈려 아무도 처형되지 않았어요'; }
  const w = mafiaWin(g, alive);
  if (w) return { u: { votes, alive, log, phase:'done', status:'done', winner:w }, msg: msg + `\n${w === 'mafia' ? '🔪 마피아 승리!' : '🙂 시민 승리!'}` };

const CHO = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
const toCho = w => [...w].map(ch => { const c = ch.charCodeAt(0) - 0xAC00; return c >= 0 && c <= 11171 ? CHO[Math.floor(c / 588)] : ch; }).join('');
function choRound(prevWord){
  const cats = Object.keys(LIAR_WORDS); let category, word, guard = 0;
  do { category = cats[Math.floor(Math.random() * cats.length)]; const ws = LIAR_WORDS[category]; word = ws[Math.floor(Math.random() * ws.length)]; }

}

function bbScore(secret, guess){ let s = 0, b = 0; for (let i = 0; i < 3; i++) { if (guess[i] === secret[i]) s++; else if (secret.includes(guess[i])) b++; } return { s, b }; }

/* 전적: 게임이 끝나면 내 결과를 한 번만 기록 */
function gameOutcome(g){
  const P = g.players.map(p => p.uid), byName = n => g.players.filter(p => p.name === n).map(p => p.uid);
  switch (g.type) {
    case 'rps': { const [a,b] = g.players, pa = g.picks?.[a.uid], pb = g.picks?.[b?.uid]; if (!pa || !pb) return null; return { P, W: pa === pb ? [] : (BEATS[pa] === pb ? [a.uid] : [b.uid]) }; }
    case 'omok': return { P, W: g.winner >= 0 ? [P[g.winner]] : [] };
    case 'bingo': return { P, W: (g.winners || []).flatMap(byName) };
    case 'wordchain': { const L = byName(g.loser); return { P, W: P.filter(u => !L.includes(u)) }; }
    case 'liar': return { P, W: g.winner === 'liar' ? [g.liar] : P.filter(u => u !== g.liar) };
    case 'mafia': return { P, W: P.filter(u => (g.roles?.[u] === 'mafia') === (g.winner === 'mafia')) };
    case 'chosung': { const sc = g.scores || {}, mx = Math.max(0, ...Object.values(sc)); return { P, W: mx > 0 ? P.filter(u => (sc[u] || 0) === mx) : [] }; }
    case 'baseball': return { P, W: g.winner ? [g.winner] : [] };
    default: return null;
  }
}

}

function fiveInRow(b, i, s){
  const x = i % 15, y = Math.floor(i / 15);
  for (const [dx,dy] of [[1,0],[0,1],[1,1],[1,-1]]) {
    let n = 1;
    for (const k of [1,-1]) {
      let cx = x + dx*k, cy = y + dy*k;
      while (cx>=0 && cx<15 && cy>=0 && cy<15 && b[cy*15+cx] === s) { n++; cx += dx*k; cy += dy*k; }
    }
    if (n >= 5) return true;
  }
  return false;
}

  ladder(g, meIn){
    if (g.status === 'waiting') return waitingHTML(g, meIn);

    const res = g.players.map((p,i) => `<div class="${i === myIdx ? 'me' : ''}"><span>${esc(p.name)}</span><b>${esc(g.outcomes[ladderEnd(n, g.rungs, i)])}</b></div>`).join('');

function renderGame(){
  const g = curGame?.data; if (!g) return;
  const info = GAMES[g.type];
  $('#gvTitle').textContent = `${info.icon} ${info.name}`;
  const ids = ['wcInput','ladderOut','liarGuess','choInput','bbSecret','bbGuess'], keep = {};
  ids.forEach(id => { const el = document.getElementById(id); if (el) keep[id] = { v: el.value, f: document.activeElement === el }; });
  $('#gvBody').innerHTML = R[g.type](g, g.players.some(p => p.uid === me.uid));
  ids.forEach(id => {
    const el = document.getElementById(id); if (!el) return;
    const k = keep[id];
    if (k) { el.value = k.v; if (k.f) el.focus(); } else if (id !== 'ladderOut') el.focus();
  });
  if (g.turnStartedAt !== lastTurnStart) { lastTurnStart = g.turnStartedAt; timeoutSent = false; }
  recordStats(g, curGame.id);
}

const ACT = {
  join(){
    tx(g => {
      if (g.status !== 'waiting') return '이미 시작된 게임이에요';
      if (g.players.some(p => p.uid === me.uid)) return null;
      if (g.players.length >= g.maxPlayers) return '자리가 꽉 찼어요';
      const players = [...g.players, { uid:me.uid, name:me.name }];
      const u = { players };
      if (g.type === 'bingo') u.boards = { ...g.boards, [me.uid]: newBingoBoard() };
      if (!HOST_START[g.type] && players.length === g.maxPlayers) u.status = 'playing';
      return u;
    });
  },
  start(){
    let msg = null;
    const outRaw = document.getElementById('ladderOut')?.value || '';
    tx(g => {
      if (g.status !== 'waiting' || g.createdBy !== me.uid) return null;
      const min = HOST_START[g.type] || 2, n = g.players.length;
      if (n < min) return `${min}명 이상 필요해요`;
      if (g.type === 'ladder') {
        let outs = clean(outRaw).split(/[,，\n]/).map(t => t.trim()).filter(Boolean).slice(0, n);
        if (!outs.length) outs = ['당첨 🎉'];
        while (outs.length < n) outs.push('꽝');
        const r = ladderRound(g, shuffle(outs)); msg = r.msg; return r.u;
      }
      if (g.type === 'liar') { msg = `🤥 라이어게임 시작! 카드를 확인하고 채팅으로 제시어를 설명하세요`; return liarRound(g); }
      if (g.type === 'chosung') { msg = '🔡 초성퀴즈 시작! 게임창에서 정답을 입력하세요'; return { status:'playing', round:1, scores:{}, lastWord:null, lastWinner:null, ...choRound() }; }
      if (g.type === 'mafia') { msg = `🔪 마피아 시작! ${n}명 중 마피아가 숨어 있어요. 🌙 첫날 밤이 되었습니다`; return mafiaRound(g); }
      return { status:'playing', turn:0, turnStartedAt: Date.now() };
    }, () => msg && sys(msg));
  },
  liarVote(){
    tx(g => (g.createdBy === me.uid && g.phase === 'talk') ? { phase:'vote', votes:{} } : null, () => sys('🗳️ 라이어 투표 시작! 게임창에서 라이어를 지목하세요'));
  },
  liarPick(v){
    let msg = null;
    tx(g => {
      if (g.phase !== 'vote') return null;
      if (!g.players.some(p => p.uid === me.uid)) return '참가자가 아니에요';
      const votes = { ...g.votes, [me.uid]: v };
      if (Object.keys(votes).length < g.players.length) return { votes };
      const r = liarTally(g, votes); msg = r.msg; return r.u;
    }, () => msg && sys(msg));
  },
  liarGuess(){
    const guess = (document.getElementById('liarGuess')?.value || '').trim();
    if (!guess) return toast('제시어를 입력하세요');
    let msg = null;
    tx(g => {
      if (g.phase !== 'guess' || g.liar !== me.uid) return null;
      const ok = guess.replace(/\s/g,'') === g.word;
      msg = ok ? `🤥 라이어 ${nameOf(g,g.liar)}님이 제시어 '${g.word}'를 맞혀 역전승! 😱` : `🤥 라이어가 '${guess}'라고 답했지만 틀렸어요! 제시어는 '${g.word}' — 시민 승리 🎉`;
      return { guess, phase:'done', status:'done', winner: ok ? 'liar' : 'citizen' };
    }, () => msg && sys(msg));
  },
  night(v){
    let msg = null;
    tx(g => {
      if (g.phase !== 'night' || !g.alive.includes(me.uid)) return null;
      const role = g.roles[me.uid];
      if (role === 'citizen' || g.night?.acted?.[me.uid]) return null;
      const night = { ...g.night, acted: { ...(g.night?.acted || {}), [me.uid]: true } };
      const u = {};
      if (role === 'mafia') night.kill = v;
      if (role === 'doctor') night.save = v;
      if (role === 'police') {
        const line = `${g.day}일차: ${nameOf(g,v)}님은 ${g.roles[v] === 'mafia' ? '마피아가 맞아요! 🔪' : '마피아가 아니에요'}`;
        u.checks = { ...g.checks, [me.uid]: [...(g.checks?.[me.uid] || []), line] };
      }
      if (nightActors(g).every(a => night.acted[a])) { const r = mafiaResolveNight({ ...g, ...u }, night); msg = r.msg; return { ...u, ...r.u }; }
      return { ...u, night };
    }, () => msg && sys(msg));
  },
  dayVote(v){
    let msg = null;
    tx(g => {
      if (g.phase !== 'day' || !g.alive.includes(me.uid)) return null;
      const votes = { ...g.votes, [me.uid]: v };
      if (!g.alive.every(a => votes[a])) return { votes };
      const r = mafiaResolveDay(g, votes); msg = r.msg; return r.u;
    }, () => msg && sys(msg));
  },
  force(){
    let msg = null;
    tx(g => {
      if (g.createdBy !== me.uid || g.status !== 'playing') return null;
      let r = null;
      if (g.type === 'liar' && g.phase === 'vote') r = liarTally(g, g.votes || {});
      if (g.type === 'mafia' && g.phase === 'night') r = mafiaResolveNight(g, g.night || {});
      if (g.type === 'mafia' && g.phase === 'day') r = mafiaResolveDay(g, g.votes || {});
      if (!r) return null;
      msg = r.msg; return r.u;
    }, () => msg && sys(msg));
  },
  pick(v){
    let msg = null;
    tx(g => {
      if (g.status !== 'playing') return '게임이 진행 중이 아니에요';
      if (!g.players.some(p => p.uid === me.uid)) return '참가자가 아니에요';
      if (g.picks?.[me.uid]) return null;
      const picks = { ...g.picks, [me.uid]: v };
      if (Object.keys(picks).length < 2) return { picks };
      const [a,b] = g.players, pa = picks[a.uid], pb = picks[b.uid];
      const result = pa === pb ? '무승부! 🤝' : (BEATS[pa] === pb ? `${a.name} 승리! 🎉` : `${b.name} 승리! 🎉`);
      msg = `✊ 가위바위보: ${a.name} ${RPS[pa]} vs ${RPS[pb]} ${b.name} → ${result}`;
      return { picks, status:'done', result };
    }, () => msg && sys(msg));
  },
  submit(){
    const inp = document.getElementById('wcInput'); if (!inp) return;
    const w = inp.value.trim();
    if (!/^[가-힣]{2,10}$/.test(w)) return toast('한글 2~10자 단어를 입력하세요');
    tx(g => {
      if (g.status !== 'playing') return '게임이 끝났어요';
      if (g.players[g.turn].uid !== me.uid) return '내 차례가 아니에요';
      const words = g.words || [], last = words.at(-1);
      if (last) { const lc = last.word.at(-1); if (w[0] !== lc && w[0] !== dueum(lc)) return `'${lc}'(으)로 시작해야 해요`; }
      if (words.some(x => x.word === w)) return '이미 나온 단어예요';
      return { words:[...words, { word:w, uid:me.uid }], turn:(g.turn + 1) % g.players.length, turnStartedAt: Date.now() };
    });
  },
  giveup(){ endWordchain('포기', false); },
  call(v){ bingoCall(+v, false); },
  cell(v){
    const i = +v; let msg = null;
    tx(g => {
      if (g.status !== 'playing') return null;
      const idx = g.players.findIndex(p => p.uid === me.uid);
      if (idx < 0) return '관전 중이에요';
      if (g.turn !== idx) return '상대 차례예요';
      if (g.board[i] !== '.') return null;
      const s = idx === 0 ? 'B' : 'W';
      const board = g.board.slice(0,i) + s + g.board.slice(i+1);
      const u = { board, last:i, turn:1 - idx };
      if (fiveInRow(board, i, s)) { u.status = 'done'; u.winner = idx; msg = `⚫ 오목: ${g.players[idx].name} 승리! 🎉`; }
      else if (!board.includes('.')) { u.status = 'done'; u.winner = -1; msg = '⚫ 오목: 무승부!'; }
      return u;
    }, () => msg && sys(msg));
  },
  choSubmit(){
    const v = (document.getElementById('choInput')?.value || '').trim().replace(/\s/g, '');
    if (!v) return;
    let msg = null, ok = false;
    tx(g => {
      if (g.status !== 'playing') return null;
      if (!g.players.some(p => p.uid === me.uid)) return '참가자가 아니에요';
      if (v !== g.word) { ok = false; return { wrong: [...(g.wrong || []), v].slice(-10) }; }
      ok = true;
      const scores = { ...g.scores, [me.uid]: (g.scores?.[me.uid] || 0) + 1 };
      if (g.round >= g.rounds) {
        const o = gameOutcome({ ...g, scores });
        msg = `🔡 초성퀴즈 끝! 🏆 ${g.players.filter(p => o.W.includes(p.uid)).map(p => p.name).join(', ')} 우승`;
        return { scores, status:'done', lastWord: g.word, lastWinner: me.uid };
      }
      return { scores, round: g.round + 1, lastWord: g.word, lastWinner: me.uid, ...choRound(g.word) };
    }, () => { const el = document.getElementById('choInput'); if (el) el.value = ''; toast(ok ? '⭕ 정답!' : '❌ 땡!'); if (msg) sys(msg); });
  },
  choPass(){
    let msg = null;
    tx(g => {
      if (g.status !== 'playing' || g.createdBy !== me.uid) return null;
      if (g.round >= g.rounds) {
        const o = gameOutcome(g);
        msg = `🔡 초성퀴즈 끝! ${o.W.length ? '🏆 ' + g.players.filter(p => o.W.includes(p.uid)).map(p => p.name).join(', ') + ' 우승' : '무승부'}`;
        return { status:'done', lastWord: g.word, lastWinner: null };
      }
      return { round: g.round + 1, lastWord: g.word, lastWinner: null, ...choRound(g.word) };
    }, () => msg && sys(msg));
  },
  bbSecret(){
    const v = (document.getElementById('bbSecret')?.value || '').trim();
    if (!validBB(v)) return toast('1~9 중 서로 다른 숫자 3개를 입력하세요');
    tx(g => {
      if (g.phase !== 'setup' || !g.players.some(p => p.uid === me.uid)) return null;
      const secrets = { ...g.secrets, [me.uid]: v }, u = { secrets };
      if (g.players.length === 2 && g.players.every(p => secrets[p.uid])) { u.phase = 'play'; u.turn = 0; }
      return u;
    });
  },
  bbGuess(){
    const v = (document.getElementById('bbGuess')?.value || '').trim();
    if (!validBB(v)) return toast('1~9 중 서로 다른 숫자 3개를 입력하세요');
    let msg = null;
    tx(g => {
      if (g.status !== 'playing' || g.phase !== 'play') return null;
      if (g.players[g.turn].uid !== me.uid) return '내 차례가 아니에요';
      const { s, b } = bbScore(g.secrets[g.players[1 - g.turn].uid], v);
      const guesses = [...(g.guesses || []), { uid: me.uid, g: v, s, b }];
      if (s === 3) { msg = `⚾ 숫자야구: ${me.name}님 승리! (${guesses.filter(x => x.uid === me.uid).length}번 만에 맞힘)`; return { guesses, status:'done', winner: me.uid }; }
      return { guesses, turn: 1 - g.turn };
    }, () => { const el = document.getElementById('bbGuess'); if (el) el.value = ''; if (msg) sys(msg); });
  },
  rematch(){
    let msg = null;
    tx(g => { const u = (() => {
      if (g.status !== 'done') return null;
      if (g.type === 'chosung') { msg = '🔡 초성퀴즈 새 판 시작!'; return { status:'playing', round:1, scores:{}, lastWord:null, lastWinner:null, ...choRound() }; }
      if (g.type === 'baseball') return { players:[g.players[1], g.players[0]], phase:'setup', secrets:{}, guesses:[], turn:0, winner:null, status:'playing' };
      if (g.type === 'ladder') { const r = ladderRound(g, shuffle(g.outcomes)); msg = r.msg; return r.u; }
      if (g.type === 'liar') { msg = '🤥 라이어게임 새 라운드! 카드를 확인하세요'; return liarRound(g); }
      if (g.type === 'mafia') { msg = '🔪 마피아 새 게임! 직업을 새로 뽑았어요 🌙'; return mafiaRound(g); }
      if (g.type === 'rps') return { picks:{}, status:'playing', result:null };
      if (g.type === 'omok') return { players:[g.players[1], g.players[0]], board:'.'.repeat(225), turn:0, last:-1, winner:null, status:'playing' };
      if (g.type === 'bingo') {
        const boards = {}; g.players.forEach(p => boards[p.uid] = newBingoBoard());
        return { boards, called:[], turn:0, turnStartedAt: Date.now(), winners:null, status:'playing' };
      }
      return { words:[], turn:0, turnStartedAt: Date.now(), loser:null, reason:null, status:'playing' };
    })(); if (u && typeof u === 'object') u.rc = (g.rc || 0) + 1; return u; }, () => msg && sys(msg));
  },
};
function endWordchain(reason, isTimeout){
  let msg = null;
  tx(g => {
    if (g.status !== 'playing') return null;
    if (isTimeout && Date.now() - g.turnStartedAt < TURN_MS) return null;
    if (!isTimeout && g.players[g.turn].uid !== me.uid) return '내 차례에만 포기할 수 있어요';
    const loser = g.players[g.turn].name;
    msg = `🔤 끝말잇기: ${loser}님 탈락! (${reason}, ${(g.words||[]).length}개 이어감)`;
    return { status:'done', loser, reason };
  }, () => msg && sys(msg));
}
function bingoCall(num, isTimeout){
  let msg = null;
  tx(g => {
    if (g.status !== 'playing') return null;
    const called = g.called || [];
    if (isTimeout) {
      if (Date.now() - g.turnStartedAt < TURN_MS) return null;
      const left = g.boards[g.players[g.turn].uid].filter(n => !called.includes(n));
      num = left[Math.floor(Math.random() * left.length)];
    } else {
      if (g.players[g.turn].uid !== me.uid) return '내 차례가 아니에요';
      if (called.includes(num)) return null;
    }
    const nc = [...called, num];
    const winners = g.players.filter(p => bingoLines(g.boards[p.uid], nc) >= BINGO_GOAL).map(p => p.name);
    const u = { called: nc, turn: (g.turn + 1) % g.players.length, turnStartedAt: Date.now() };
    if (winners.length) { u.status = 'done'; u.winners = winners; msg = `🎱 빙고: ${winners.join(', ')} 승리! 🎉 (${nc.length}번 만에)`; }
    return u;
  }, () => msg && sys(msg));
}
$('#gvBody').addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  ACT[b.dataset.act]?.(b.dataset.v);
});
$('#gvBody').addEventListener('keydown', e => {
  const map = { wcInput:'submit', liarGuess:'liarGuess', choInput:'choSubmit', bbSecret:'bbSecret', bbGuess:'bbGuess' };
  if (map[e.target.id] && isEnter(e)) { e.preventDefault(); ACT[map[e.target.id]](); }
});
// 턴 타이머 (끝말잇기·빙고)
setInterval(() => {
  const g = curGame?.data, bar = document.getElementById('wcTimer');
  if (!g || !TURN_GAMES.includes(g.type) || g.status !== 'playing' || !bar) return;
  const left = TURN_MS - (Date.now() - g.turnStartedAt);
  bar.style.width = Math.max(0, left / TURN_MS * 100) + '%';
  bar.style.background = left < 5000 ? '#ff3d71' : '';
  if (left < -1500 && !timeoutSent && g.players.some(p => p.uid === me.uid)) { timeoutSent = true; if (g.type === 'bingo') bingoCall(0, true); else endWordchain('시간 초과', true); }
}, 250);

// 안드로이드 앱 뒤로가기: 열린 창 닫기 → 채팅방에서 홈으로 → (없으면 앱 종료)
window.noltalkBack = () => {
  const open = document.querySelector('.overlay.show');
  if (open) { if (open.id === 'gameView') closeGame(); else open.classList.remove('show'); return true; }
  if ($('#room').classList.contains('active')) { if (replyTo) { setReply(null); return true; } backHome(); return true; }
  return false;
};
if ('serviceWorker' in navigator && !navigator.userAgent.includes('NoltalkApp')) navigator.serviceWorker.register('sw.js').catch(() => {});
