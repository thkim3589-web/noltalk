name: Android APK 빌드

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: APK 빌드
        working-directory: android
        run: gradle assembleRelease --no-daemon
      - name: 파일 이름 정리
        run: cp android/app/build/outputs/apk/release/app-release.apk noltalk.apk
      - uses: actions/upload-artifact@v4
        with:
          name: noltalk-apk
          path: noltalk.apk
      - name: 릴리스에 APK 올리기 (항상 최신)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 놀톡 최신 버전 (빌드 ${{ github.run_number }})
          body: 아래 noltalk.apk를 폰에서 눌러 설치하세요.
          prerelease: false
          make_latest: true
          files: noltalk.apk
